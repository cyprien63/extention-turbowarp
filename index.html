<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargeur d'extensions TurboWarp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Chargeur d'extensions TurboWarp</h1>
        
        <div class="input-group">
            <label for="extensionUrl">URL de l'extension :</label>
            <input type="text" id="extensionUrl" placeholder="https://exemple.com/extension.js">
            <button id="loadBtn">Ouvrir dans TurboWarp</button>
        </div>

        <div class="presets">
            <h2>Extensions courantes</h2>
            <div id="presetList"></div>
        </div>

        <div class="history">
            <h2>Historique</h2>
            <ul id="historyList"></ul>
            <button id="clearHistory">Effacer l'historique</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
